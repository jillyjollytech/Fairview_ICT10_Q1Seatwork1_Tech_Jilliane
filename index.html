<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Q1 Seatwork 1</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- PyScript -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.3.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>

    <style>
        body {
            background: linear-gradient(135deg, #dbead2, #c1d0b5);
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }

        .main-container {
            max-width: 900px;
            margin-left: 40px;
            margin-right: auto;
        }

        .header {
            background: linear-gradient(#78866b, #8f9779);
            color: white;
            border-radius: 20px;
            padding: 35px;
        }

        .section-card {
            border: none;
            border-radius: 20px;
            transition: transform 0.2s ease;
        }

        .section-card:hover {
            transform: translateY(-3px);
        }

        .section-title {
            color: #78866b;
            font-weight: bold;
        }

        #div1 {
            background-color: #fff8de;
            border-radius: 15px;
            padding: 20px;
            line-height: 1.8;
        }

        .form-control {
            border-radius: 12px;
            padding: 12px;
            border: 1px solid #8f9779;
        }

        .form-control:focus {
            border-color: #78866b;
        }

        .solve-btn {
            background-color: #78866b;
            border: none;
            border-radius: 12px;
            padding: 12px 30px;
            font-weight: bold;
            color: white;
        }

        .solve-btn:hover {
            background-color: #fff8de;
        }

        #div2 {
            background-color: #dbead2;
            border: 2px solid #8f9779;
            border-radius: 15px;
            padding: 20px;
            text-align: left;
            font-size: 1.3rem;
            font-weight: bold;
            color: #99a98f;
        }
    </style>
</head>

<body>

    <div class="container py-5 main-container">

        <!-- Header -->
        <div class="header text-start mb-4">
          <h1 class="display-5 fw-bold">Seatwork 1</h1>
          <p class="lead mb-0">My Info & a Calculator</p>
          </div>

        <!-- My Info -->
        <div class="card section-card mb-4">
            <div class="card-body p-4">

            <h2 class="section-title mb-3">
                    Info Card
                </h2>

                <div id="div1"></div>

            </div>
        </div>

        <!-- Calculator -->
        <div class="card section-card">
            <div class="card-body p-4">

                <h2 class="section-title">
                    Try the Calculator!
                </h2>

                <p class="text-muted">
                    Enter two numbers and calculate :3
                </p>

                <form>

                    <div class="mb-3">
                        <label for="input1" class="form-label fw-bold">
                            First Number
                        </label>

                        <input
                            type="text"
                            id="input1"
                            class="form-control"
                            placeholder="..."
                        >
                    </div>

                    <div class="mb-3">
                        <label for="input2" class="form-label fw-bold">
                            Second Number
                        </label>

                        <input
                            type="text"
                            id="input2"
                            class="form-control"
                            placeholder="..."
                        >
                    </div>

                    <div class="text-start">
                        <button
                            type="button"
                            py-click="adding_numbers"
                            class="btn solve-btn"
                        >
                            Calculate
                        </button>
                    </div>

                </form>

                <div class="mt-4">
                    <div id="div2">
                        Your result will appear here.
                    </div>
                </div>

            </div>
        </div>
    
    </div>

    <!-- PyScript Python File -->
    <script type="py" src="main.py"></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
